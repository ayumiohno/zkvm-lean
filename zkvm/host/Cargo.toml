[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
methods = { path = "../methods" }
risc0-zkvm = { version = "^3.0.6" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = "1.0"
serde_json = "1.0"
bytemuck = "1"
bincode = "1.3"
sha2 = { version = "0.10", default-features = false }
stmt = { path = "../stmt" }
nanoda_lib = { path = "../../forks/nanoda_lib", features = ["touch_trace"] }

# Proving on GPU. Building with `cargo build --release --features cuda` pulls in
# risc0-zkvm's `prove`, so default_prover() selects the in-process LocalProver (CUDA)
# instead of r0vm (IPC/CPU). Requires a CUDA toolkit (nvcc).
[features]
cuda = ["risc0-zkvm/cuda"]
